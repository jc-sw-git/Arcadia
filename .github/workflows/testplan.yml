name: Testplan

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  testplan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Closed issues have tests in the test plan
        env:
          # Passed via env, never interpolated into the script: the description is user input.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: tools/ci/check-testplan.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
