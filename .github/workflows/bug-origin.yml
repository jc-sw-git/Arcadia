name: Bug origin

# A closed bug must say where it came from, so the release notes can leave out bugs that never shipped.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read

jobs:
  bug-origin:
    # Our own way of working (docs/testplans/, docs/releases.md), not a rule for contributors: their PRs skip it,
    # which a required check counts as passed.
    if: github.event.pull_request.user.login == 'jc-sw-git'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Closed bugs name their origin
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env, never interpolated into the script: the description is user input.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: tools/ci/check-bug-origin.sh
