# Monthly update PRs for the pinned GitHub Actions (by commit SHA, see the workflows) and the NuGet packages. Grouped,
# so a month's actions updates, or a month's minor and patch NuGet updates, arrive as one PR; each goes through CI and
# the owner's review like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # CI only: left out of the release notes like ci/ branches (label-pr-changelog.yml).
    labels: [no-changelog]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    # Listed by folder, not as "/": only with several directories does group-by below bring a new major version to
    # all projects in one PR instead of one PR per project.
    directories: ["/src/*", "/tests/*", "/tools/dev/*"]
    schedule:
      interval: monthly
    # Minor and patch updates come as one PR; a new major version comes as a PR of its own (for all projects at once),
    # so one that breaks the build doesn't hold back the others.
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
      nuget-major:
        patterns: ["*"]
        update-types: [major]
        group-by: dependency-name
    ignore:
      # Avalonia.Headless.XUnit is built against xunit v3's 3.x API: with xunit 4 the window tests aren't even found
      # (MissingMethodException in discovery). The VS runner 4 belongs to
      # xunit 4. Lift both once Avalonia.Headless.XUnit supports xunit 4.
      - dependency-name: xunit.v3
        update-types: [version-update:semver-major]
      - dependency-name: xunit.runner.visualstudio
        update-types: [version-update:semver-major]
      # Svg.Skia 5.2 needs SkiaSharp 4, while Avalonia 12.1 ships SkiaSharp 3's native library on Linux: every
      # window test fails there. Lift once Avalonia moves to SkiaSharp 4.
      - dependency-name: Svg.Skia
        versions: [">=5.2.0"]
