name: Doc sizes

on:
  pull_request:

permissions:
  contents: read

jobs:
  doc-sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CLAUDE.md and docs stay within their size limits
        run: tools/ci/check-doc-sizes.sh
