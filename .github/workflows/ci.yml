name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run of its previous head; pushes to main all run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A push that only touches docs/testplans/** (marking manual tests as passed) skips build and tests, so the PR is
  # green again within a minute. The build job still runs, with its steps skipped: required status checks are the
  # job names "build (<os>)", and a job skipped as a whole would leave them pending. Rules: tools/ci/detect-testplan-only.sh.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      skip_build: ${{ steps.detect.outputs.skip_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          tools/ci/detect-testplan-only.sh
          "${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before || '' }}"
          "${{ github.event.pull_request.head.sha }}"

  build:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A PR's run takes about 5 min; this only ends a hung one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.skip_build != 'true'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: needs.changes.outputs.skip_build != 'true'
        with:
          dotnet-version: 10.0.x
      - name: Build
        if: needs.changes.outputs.skip_build != 'true'
        run: dotnet build Arcadia.slnx --configuration Release
      # Pan's hiding (#243 part B) against the real HidHide driver; if it can't be set up there, those tests skip.
      - name: Install HidHide
        if: needs.changes.outputs.skip_build != 'true' && runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: ./tools/ci/Install-HidHide.ps1
      # Coverage is collected on Windows only: it is the platform Arcadia ships for, and only there do the
      # Windows-specific code paths run.
      # Linux tests under a German culture (decimal comma), Windows under the runner's en-US: a test or log line that
      # formats numbers with the current culture fails on one of them (#364).
      # The App tests run in 4 shards beside the other projects: the runners have 4 cores (tools/ci/run-tests.sh).
      - name: Test
        if: needs.changes.outputs.skip_build != 'true'
        shell: bash
        env:
          LANG: ${{ runner.os == 'Linux' && 'de_DE.UTF-8' || '' }}
        run: >-
          tools/ci/run-tests.sh 4
          ${{ runner.os == 'Windows' && '--collect:"XPlat Code Coverage" --results-directory TestResults' || '' }}
      # Compiled XAML is generated by Avalonia and would only dilute the numbers.
      - name: Coverage report
        if: needs.changes.outputs.skip_build != 'true' && runner.os == 'Windows'
        shell: bash
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.12 --tool-path .tools
          .tools/reportgenerator -reports:'TestResults/**/coverage.cobertura.xml' -targetdir:coverage \
            -reporttypes:'HtmlInline;MarkdownSummaryGithub' -assemblyfilters:'+Arcadia.*' \
            -classfilters:'-CompiledAvaloniaXaml.*;-XamlGeneratedNamespace.*'
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      # Uploaded on pull requests too, so a PR shows its coverage; prune-artifacts.yml keeps the newest few.
      - name: Upload coverage report
        if: needs.changes.outputs.skip_build != 'true' && runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
      # Only main's installer is packed and kept: a PR that changes packing (tools/release/) is checked after its
      # merge, a minute saved on every other PR. The account's artifact storage is counted per hour over the billing
      # month and runs out despite pruning, so a failed upload only warns instead of failing a green build.
      - name: Pack installer
        if: needs.changes.outputs.skip_build != 'true' && runner.os == 'Windows' && github.event_name == 'push'
        shell: pwsh
        # Velopack needs a version >= 0.0.1.
        run: ./tools/release/Pack.ps1 -Version 0.0.1-ci.${{ github.run_number }}
      - name: Upload installer
        if: needs.changes.outputs.skip_build != 'true' && runner.os == 'Windows' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Arcadia-win-Setup
          path: artifacts/releases/Arcadia-win-Setup.exe
          retention-days: 1
