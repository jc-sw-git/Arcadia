name: Doc sizes

on:
  pull_request:

jobs:
  doc-sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: CLAUDE.md and docs stay within their size limits
        run: tools/ci/check-doc-sizes.sh
