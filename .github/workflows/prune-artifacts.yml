name: Prune artifacts

# The CI uploads a Windows installer (main only) and a coverage report per run. On a private repo the
# artifact storage is small and fills up after a few pushes, which then fails the CI's upload step.
# This keeps only the newest few of each kind, so frequent coverage reports from pull requests don't
# push out the installers still worth testing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: prune-artifacts

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const keep = 5;
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const newestFirst = artifacts
              .filter(artifact => !artifact.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const keptPerName = new Map();
            for (const artifact of newestFirst) {
              const kept = keptPerName.get(artifact.name) ?? 0;
              if (kept < keep) {
                keptPerName.set(artifact.name, kept + 1);
                continue;
              }
              core.info(`Deleting ${artifact.name} (${artifact.id}) from ${artifact.created_at}`);
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            }
            for (const [name, kept] of keptPerName) core.info(`Kept ${kept} ${name}.`);
