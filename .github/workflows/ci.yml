name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Arcadia.slnx --configuration Release
      - name: Test
        run: dotnet test Arcadia.slnx --configuration Release --no-build
      - name: Pack installer
        if: runner.os == 'Windows'
        shell: pwsh
        # Velopack needs a version >= 0.0.1.
        run: ./tools/release/Pack.ps1 -Version 0.0.1-ci.${{ github.run_number }}
      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Arcadia-win-Setup
          path: artifacts/releases/Arcadia-win-Setup.exe
          retention-days: 7
