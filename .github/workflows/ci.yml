name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A push that only touches docs/testplans/** (marking manual tests as passed) skips build and tests, so the PR is
  # green again within a minute. The build job still runs, with its steps skipped: required status checks are the
  # job names "build (<os>)", and a job skipped as a whole would leave them pending. Rules: tools/ci/detect-testplan-only.sh.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      skip_build: ${{ steps.detect.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          tools/ci/detect-testplan-only.sh
          "${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before || '' }}"
          "${{ github.event.pull_request.head.sha }}"

  build:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.skip_build != 'true'
      - uses: actions/setup-dotnet@v4
        if: needs.changes.outputs.skip_build != 'true'
        with:
          dotnet-version: 10.0.x
      - name: Build
        if: needs.changes.outputs.skip_build != 'true'
        run: dotnet build Arcadia.slnx --configuration Release
      # Coverage is collected on Windows only: it is the platform Arcadia ships for, and only there do the
      # Windows-specific code paths run.
      - name: Test
        if: needs.changes.outputs.skip_build != 'true'
        run: >-
          dotnet test Arcadia.slnx --configuration Release --no-build
          ${{ runner.os == 'Windows' && '--collect:"XPlat Code Coverage" --results-directory TestResults' || '' }}
      # Compiled XAML is generated by Avalonia and would only dilute the numbers.
      - name: Coverage report
        if: needs.changes.outputs.skip_build != 'true' && runner.os == 'Windows'
        shell: bash
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.12 --tool-path .tools
          .tools/reportgenerator -reports:'TestResults/**/coverage.cobertura.xml' -targetdir:coverage \
            -reporttypes:'HtmlInline;MarkdownSummaryGithub' -assemblyfilters:'+Arcadia.*' \
            -classfilters:'-CompiledAvaloniaXaml.*;-XamlGeneratedNamespace.*'
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      # Uploaded on pull requests too, so a PR shows its coverage; prune-artifacts.yml keeps the newest few.
      - name: Upload coverage report
        if: needs.changes.outputs.skip_build != 'true' && runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
      - name: Pack installer
        if: needs.changes.outputs.skip_build != 'true' && runner.os == 'Windows'
        shell: pwsh
        # Velopack needs a version >= 0.0.1.
        run: ./tools/release/Pack.ps1 -Version 0.0.1-ci.${{ github.run_number }}
      # Packing runs on every build to check Pack.ps1; only main's installer is kept. The account's
      # artifact storage is counted per hour over the billing month and runs out despite pruning,
      # so a failed upload only warns instead of failing a green build.
      - name: Upload installer
        if: needs.changes.outputs.skip_build != 'true' && runner.os == 'Windows' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Arcadia-win-Setup
          path: artifacts/releases/Arcadia-win-Setup.exe
          retention-days: 1
