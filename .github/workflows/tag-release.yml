name: Tag release

# Started by hand (Actions → "Tag release" → Run workflow, on main): sets the tag vX.Y.Z on the newest main commit and
# starts release.yml for it. Exists because Claude's cloud sessions can't push tags; a tag pushed by hand still works.
# A tag created with GITHUB_TOKEN doesn't trigger push workflows, so release.yml is started via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v", e.g. 0.2.0 or 0.2.0-beta.1'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Passed via env, never interpolated into the script: the input is user-supplied.
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check input
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Run this on main, not $GITHUB_REF"; exit 1; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a SemVer version like 1.2.3"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::Tag v$VERSION exists already"; exit 1
          fi

      - name: Create tag
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" --silent

      - name: Start release
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"
          echo "Tagged $GITHUB_SHA as v$VERSION; release.yml started." >> "$GITHUB_STEP_SUMMARY"
