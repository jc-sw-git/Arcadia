name: Code sizes

on:
  pull_request:

jobs:
  code-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point at large source files the PR changes (warning only)
        run: tools/ci/check-code-sizes.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
