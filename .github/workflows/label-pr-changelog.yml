name: Label PR for changelog

# Release notes list only issues and PRs that change the product (docs/releases.md). Branch prefix decides the
# default: doc/, ci/ and test/ PRs get `no-changelog`; feat/, fix/ and td/ PRs stay in: refactorings and tech debt change
# the product too, which matters to plugin authors and contributors.
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Passed via env, never interpolated into the script: the branch name is user input.
      BRANCH: ${{ github.event.pull_request.head.ref }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Label doc, ci and test PRs
        run: |
          case "$BRANCH" in
            doc/*|ci/*|test/*)
              gh label create no-changelog --repo "$GITHUB_REPOSITORY" --color ededed \
                --description "Left out of the release notes" 2>/dev/null || true
              gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label no-changelog ;;
          esac
