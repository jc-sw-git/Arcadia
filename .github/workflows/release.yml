name: Release

# Push a tag like v0.2.0 (or v0.2.0-beta.1 for a pre-release) to publish a release.
# Versioning: SemVer; major may break, minor adds non-breaking features, patch only fixes bugs.
# tag-release.yml sets the tag and starts this workflow via workflow_dispatch on that tag; run on a branch, the
# version check below fails.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: only the job that publishes gets write access, so the tests never hold a token that could
# change the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Arcadia.slnx --configuration Release
      - name: Test
        shell: bash
        run: tools/ci/run-tests.sh 4

  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        id: version
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag $tag is not a SemVer version like v1.2.3" }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "prerelease=$([bool]$Matches[2])".ToLower() >> $env:GITHUB_OUTPUT

      - name: Write release notes
        run: |
          $tag = '${{ github.ref_name }}'
          # One entry per issue; which PRs and issues count: docs/releases.md.
          $generated = ./tools/release/Write-ReleaseNotes.ps1 -Tag $tag -Repository '${{ github.repository }}'
          @"
          **Installation:** download and run ``Arcadia-win-Setup.exe``. Installed versions update themselves.
          Windows SmartScreen warns because Arcadia isn't signed yet: "More info" → "Run anyway".

          Arcadia is free software (GPL-3.0). Source code of this version: $env:REPO_URL/tree/$tag

          $generated
          "@ | Set-Content -Encoding utf8 release-notes.md

      - name: Download previous release (for delta updates)
        run: |
          dotnet tool restore
          $pre = if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { '--pre' } else { $null }
          dotnet vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir artifacts/releases $pre
          if ($LASTEXITCODE -ne 0) { Write-Host 'No previous release; building full packages only.'; $global:LASTEXITCODE = 0 }

      - name: Pack
        run: ./tools/release/Pack.ps1 -Version '${{ steps.version.outputs.version }}' -ReleaseNotes release-notes.md

      - name: Publish
        run: |
          $tag = '${{ github.ref_name }}'
          $pre = if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { '--pre' } else { $null }
          dotnet vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir artifacts/releases `
            --publish --tag $tag --releaseName "Arcadia ${{ steps.version.outputs.version }}" $pre
          if ($LASTEXITCODE -ne 0) { throw 'vpk upload failed' }
          gh release edit $tag --notes-file release-notes.md
          gh release upload $tag LICENSE THIRD-PARTY-NOTICES.md --clobber
